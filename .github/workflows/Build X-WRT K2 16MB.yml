name: Build X-WRT K2 16MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2204)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: 3. Clone X-WRT source code
        run: |
          mkdir -p /home/runner/work/x-wrt
          cd /home/runner/work/x-wrt
          git clone https://github.com/x-wrt/x-wrt.git openwrt
          ln -sf /home/runner/work/x-wrt/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 4. Load custom configuration
        run: |
          cat > openwrt/.config << 'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7620=y
          CONFIG_TARGET_ramips_mt7620_DEVICE_phicomm_k2=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          EOF

      - name: 5. Compile the firmware
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make -j$(nproc) download
          make -j$(nproc) || make -j1 V=s

      - name: 6. Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_K2_Firmware
          path: openwrt/bin/targets/ramips/mt7620/*.bin
